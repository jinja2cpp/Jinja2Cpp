# libabigail suppressions for the abidiff job (.github/workflows/linux-build.yml, docs/tasks/0076).
# Only vendored internals that no public signature exposes are suppressed. jinja2::v2::detail
# is not: inline functions in the public headers call exported detail functions, so those
# are ABI too.

# jbcoe/value_types, vendored as jinja2::v2::detail::xyz; header-only templates, their
# layout reaches users only through Value, which is reported on its own
[suppress_function]
  name_regexp = ^jinja2::v2::detail::xyz::

[suppress_variable]
  name_regexp = ^jinja2::v2::detail::xyz::

# robin_hood.h and lexertk.h are private to src/ and hidden by -fvisibility=hidden
[suppress_type]
  name_regexp = ^(robin_hood|lexertk)::

[suppress_function]
  name_regexp = ^(robin_hood|lexertk)::

[suppress_variable]
  name_regexp = ^(robin_hood|lexertk)::
