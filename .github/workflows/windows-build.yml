name: CI-windows-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-msvc-build:
    name: MSVC C++${{ matrix.std }} ${{ matrix.build-config }} runtime=${{ matrix.build-runtime || 'default' }} shared=${{ matrix.build-shared }}
    runs-on: windows-latest

    # Standard x runtime is covered fully; build type and linkage pairwise (see linux-build.yml).
    # CMake maps C++23 to /std:c++latest until MSVC ships a stable /std:c++23.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build-platform: x64, std: 17, build-runtime: "",  build-config: Release, build-shared: FALSE }
          - { build-platform: x64, std: 17, build-runtime: /MD, build-config: Debug,   build-shared: TRUE }
          - { build-platform: x64, std: 17, build-runtime: /MT, build-config: Debug,   build-shared: TRUE }
          - { build-platform: x64, std: 20, build-runtime: "",  build-config: Debug,   build-shared: TRUE }
          - { build-platform: x64, std: 20, build-runtime: /MD, build-config: Release, build-shared: TRUE }
          - { build-platform: x64, std: 20, build-runtime: /MT, build-config: Debug,   build-shared: FALSE }
          - { build-platform: x64, std: 23, build-runtime: "",  build-config: Debug,   build-shared: TRUE }
          - { build-platform: x64, std: 23, build-runtime: /MD, build-config: Debug,   build-shared: FALSE }
          - { build-platform: x64, std: 23, build-runtime: /MT, build-config: Release, build-shared: TRUE }

    steps:
    - uses: actions/checkout@v4

    # Setup MSVC environment
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.build-platform }}

    - name: Build
      shell: cmd
      env:
        INPUT_COMPILER: ${{ matrix.compiler }}
        INPUT_BASE_FLAGS: -DJINJA2CPP_CXX_STANDARD=${{ matrix.std }}
        INPUT_BUILD_CONFIG: ${{ matrix.build-config }}
        INPUT_BUILD_SHARED: ${{ matrix.build-shared }}
        INPUT_EXTRA_FLAGS: ${{ matrix.extra_flags }}
        INPUT_BUILD_PLATFORM: ${{ matrix.build-platform }}
        INPUT_BUILD_RUNTIME: ${{ matrix.build-runtime }}
      run: |
        mkdir .build
        cd .build
        cmake --version
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=%INPUT_BUILD_CONFIG% -DJINJA2CPP_MSVC_RUNTIME_TYPE="%INPUT_BUILD_RUNTIME%" -DJINJA2CPP_DEPS_MODE=internal -DJINJA2CPP_BUILD_SHARED=%INPUT_BUILD_SHARED% %INPUT_BASE_FLAGS% %INPUT_EXTRA_FLAGS%
        cmake --build . --config %INPUT_BUILD_CONFIG% --verbose

    - name: Test
      shell: cmd
      env:
        INPUT_BUILD_CONFIG: ${{ matrix.build-config }}
      run: |
        cd .build
        ctest -C %INPUT_BUILD_CONFIG% -V
