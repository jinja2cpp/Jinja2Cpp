name: fuzz

# libFuzzer with ASan and UBSan over the targets in fuzz/ (docs/tasks/0003, fuzz/README.md),
# in two modes (docs/tasks/0185):
# - Pull requests that touch the engine replay the corpus the nightly run kept, plus the
#   seeds, once per input and generate nothing new, so the verdict depends only on the
#   change: a known input that now crashes fails the job and is uploaded.
# - Nightly on master (and on demand on any branch) the fuzzer generates new inputs from that
#   corpus for an hour per target; the minimized corpus is saved to the Actions cache for the
#   next runs, and the differential check against Python Jinja2 runs over the render corpus
#   (report only). A crash it finds fails that run, not a pull request.
# The template targets (parse, render, render_wide and the limits-on ones) mutate with the
# structure-aware mutator of fuzz/template_mutator.h (docs/tasks/0095); `mutator: bytes` on a manual
# run turns it off, to compare the two in one time budget. The nightly differential check also
# renders templates from the grammar of fuzz/generate_templates.py, which Python always parses.
# The targets with default settings report timeouts and out-of-memory inputs without failing:
# a template may ask for unbounded work (range(10**9)). The limits-on targets (untrusted, host,
# loader, alloc_failure; docs/tasks/0267) run under FuzzLimits() (fuzz_common.h), which bounds
# both, so there a timeout or out-of-memory input fails the job like a crash.

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'fuzz/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'
      mutator:
        description: Mutation of the template targets (structure, or bytes only)
        type: choice
        options: [structure, bytes]
        default: structure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}

    strategy:
      fail-fast: false
      matrix:
        # render runs with the Boost big-integer backend, so that `**` and the size caps on
        # big values are fuzzed too (docs/tasks/0272); render_wide keeps the default none
        # metadata reads {% meta %} JSON (docs/tasks/0230, step D6); prompt_escape checks that prompt
        # autoescape lets no special token of the data through (docs/tasks/0358)
        # untrusted, host, loader and alloc_failure run under limits and read a few bytes before the
        # template (settings, handler, allocation to fail; docs/tasks/0267)
        target: [parse, render, render_wide, metadata, prompt_escape, untrusted, host, loader, alloc_failure]

    env:
      FUZZ_MODE: ${{ github.event_name == 'pull_request' && 'replay' || 'generate' }}
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '3600' || inputs.seconds || '600' }}
      # Keep the corpus only from runs on master, so pull requests never feed it
      SAVE_CORPUS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      # Under limits a timeout or out-of-memory input is a finding (docs/tasks/0267)
      STRICT: ${{ contains(fromJSON('["untrusted", "host", "loader", "alloc_failure"]'), matrix.target) }}
      # make_corpus.py --prefix for the targets that read bytes before the template
      SEED_PREFIX: ${{ contains(fromJSON('["untrusted", "host", "loader", "alloc_failure"]'), matrix.target) && format('--prefix {0}', matrix.target) || '' }}
      # bytes turns the structure-aware mutator off (fuzz/template_mutator.h)
      JINJA2CPP_FUZZ_MUTATOR: ${{ inputs.mutator || 'structure' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: clang-18

    - uses: ./.github/actions/setup-ccache
      with:
        key: fuzz-clang-18-${{ matrix.target }}-${{ matrix.target == 'render' && 'bigint' || 'none' }}

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_WITH_SANITIZERS=address+undefined \
          -DJINJA2CPP_WITH_BIGINT=${{ matrix.target == 'render' && 'boost' || 'none' }} \
          -DJINJA2CPP_BUILD_FUZZERS=ON \
          -DJINJA2CPP_CHECK_SLOTS=ON \
          -DJINJA2CPP_BUILD_TESTS=OFF \
          -DJINJA2CPP_STRICT_WARNINGS=OFF

    - name: Build
      run: cmake --build build --target jinja2cpp_fuzz_${{ matrix.target }} --parallel

    - name: Restore corpus
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: corpus
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: fuzz-corpus-${{ matrix.target }}-

    # Generated templates (a fixed set) give the structure-aware mutator deep, well-formed starting points
    - name: Add seeds
      run: python3 fuzz/make_corpus.py $SEED_PREFIX --generated 500 corpus

    # The limits-on target must fail the job on a slow input: an input the target hangs on when
    # JINJA2CPP_FUZZ_INJECT_SLOW is set (untrusted_targets.cpp) has to make the replay fail
    - name: Check that a slow input fails the job
      if: matrix.target == 'untrusted'
      run: |
        mkdir -p slow-seed
        printf '\xffjinja2cpp-fuzz-slow-seed' > slow-seed/slow
        if JINJA2CPP_FUZZ_INJECT_SLOW=1 python3 fuzz/replay_corpus.py build/fuzz/jinja2cpp_fuzz_untrusted slow-seed \
            --strict --timeout 5 --artifacts slow-artifacts --log slow.log > slow-out.log 2>&1; then
          cat slow-out.log
          echo "::error::the injected slow seed did not fail the replay of the limits-on target"
          exit 1
        fi
        grep -q 'timeouts: 1' slow-out.log || { cat slow-out.log; echo "::error::the injected slow seed failed for another reason"; exit 1; }
        echo "injected slow seed: replay failed on its timeout, as it must" >> "$GITHUB_STEP_SUMMARY"

    - name: Replay corpus
      if: env.FUZZ_MODE == 'replay'
      run: |
        python3 fuzz/replay_corpus.py build/fuzz/jinja2cpp_fuzz_${{ matrix.target }} corpus \
          --artifacts artifacts --log fuzz.log --summary "$GITHUB_STEP_SUMMARY" \
          ${{ env.STRICT == 'true' && '--strict' || '' }}

    - name: Fuzz
      if: env.FUZZ_MODE == 'generate'
      shell: bash
      run: |
        mkdir -p artifacts
        set +e
        # Under limits a timeout or out-of-memory input stops the run as a crash does
        if [ "$STRICT" = true ]; then ignore=(); else ignore=(-ignore_timeouts=1 -ignore_ooms=1); fi
        # A custom mutator makes libFuzzer turn length control off; the byte-only baseline keeps master's default
        if [ "$JINJA2CPP_FUZZ_MUTATOR" = bytes ]; then ignore+=(-len_control=100); fi
        build/fuzz/jinja2cpp_fuzz_${{ matrix.target }} corpus \
          -dict=fuzz/jinja2.dict -max_len=4096 -timeout=25 -rss_limit_mb=2560 \
          -fork=2 "${ignore[@]}" \
          -max_total_time="$FUZZ_SECONDS" -artifact_prefix=artifacts/ > fuzz.log 2>&1
        status=$?
        set -e
        tail -n 40 fuzz.log
        crashes=$(find artifacts -name 'crash-*' -o -name 'leak-*' | wc -l)
        timeouts=$(find artifacts -name 'timeout-*' -o -name 'slow-unit-*' | wc -l)
        ooms=$(find artifacts -name 'oom-*' | wc -l)
        {
          echo "### fuzz ${{ matrix.target }}"
          echo
          echo '```'
          grep -E '^#[0-9]+' fuzz.log | tail -n 1
          echo '```'
          echo "crashes: $crashes, timeouts: $timeouts, out of memory: $ooms (exit status $status)"
        } >> "$GITHUB_STEP_SUMMARY"
        # slow-unit-* (a unit past 10 s that finished) stays a report: maxRenderTime may be overrun by one
        # step (docs/tasks/0282); a timeout-* did not finish in 25 s
        hard_timeouts=$(find artifacts -name 'timeout-*' | wc -l)
        if [ "$STRICT" = true ] && [ $((hard_timeouts + ooms)) -ne 0 ]; then
          echo "::error::${{ matrix.target }} runs under limits and found $hard_timeouts timeout(s), $ooms out-of-memory input(s); see the fuzz-artifacts-${{ matrix.target }} artifact"
          exit 1
        fi
        if [ "$crashes" -ne 0 ]; then
          grep -A 30 -E 'ERROR: (AddressSanitizer|LeakSanitizer|UndefinedBehaviorSanitizer|libFuzzer)|runtime error' fuzz.log | head -n 120 || true
          echo "::error::${{ matrix.target }} found $crashes crashing or leaking input(s); see the fuzz-artifacts-${{ matrix.target }} artifact"
          exit 1
        fi
        # A failure that left no reproducer is the fuzzer's own (bad flag, corpus, setup)
        if [ "$status" -ne 0 ] && [ "$timeouts" -eq 0 ] && [ "$ooms" -eq 0 ]; then
          echo "::error::jinja2cpp_fuzz_${{ matrix.target }} exited with status $status and no reproducer"
          exit 1
        fi

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: fuzz-artifacts-${{ matrix.target }}
        path: |
          artifacts/
          fuzz.log
        if-no-files-found: ignore

    - name: Minimize corpus
      if: env.SAVE_CORPUS == 'true'
      run: |
        mkdir corpus-min
        # Keep the unminimized corpus when the merge fails
        if build/fuzz/jinja2cpp_fuzz_${{ matrix.target }} -merge=1 -timeout=25 -rss_limit_mb=2560 corpus-min corpus > merge.log 2>&1 \
            && [ -n "$(ls corpus-min)" ]; then
          rm -rf corpus && mv corpus-min corpus
        else
          tail -n 20 merge.log
        fi
        echo "corpus: $(ls corpus | wc -l) inputs" >> "$GITHUB_STEP_SUMMARY"

    - name: Save corpus
      if: env.SAVE_CORPUS == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: corpus
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  differential:
    name: differential check against Python Jinja2
    needs: fuzz
    # A crash in one target still leaves the others' corpus worth comparing
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: .python-version

    - name: Install pinned jinja2
      run: python -m pip install -r test/parity/requirements.txt

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_DEPS_MODE=internal
        cmake --build build --target jinja2cpp_fuzz_replay --parallel

    - name: Restore render corpus
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: corpus
        key: fuzz-corpus-render-${{ github.run_id }}
        restore-keys: fuzz-corpus-render-

    - name: Compare
      run: |
        mkdir -p corpus
        python3 fuzz/make_corpus.py corpus
        python3 fuzz/make_corpus.py --parity-only seeds-parity
        python fuzz/differential.py build/jinja2cpp_fuzz_replay corpus --known seeds-parity --out differential.md \
          | tee -a "$GITHUB_STEP_SUMMARY"

    # Every generated template parses in Python, so each difference is a divergence, not a rejected input; a new seed
    # each run reaches new combinations. The report gives the share both engines render (docs/tasks/0095)
    - name: Compare generated templates
      run: |
        python fuzz/generate_templates.py generated --count 5000 --seed ${{ github.run_number }}
        echo "generated templates, seed ${{ github.run_number }}:" >> "$GITHUB_STEP_SUMMARY"
        python fuzz/differential.py build/jinja2cpp_fuzz_replay generated --out differential-generated.md \
          --title "Differential report: generated templates (seed ${{ github.run_number }})" | tee -a "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: differential-report
        path: |
          differential.md
          differential-generated.md
