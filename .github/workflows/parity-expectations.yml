name: parity-expectations

# The parity corpus (test/parity) stores Python Jinja2 output next to each case. This job
# regenerates it with the pinned jinja2 and fails if the checked-in files are stale, so a
# case edited without regenerating cannot pass review. The C++ side of the comparison runs
# in every build job as `ctest -R parity`.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'test/parity/**'
      - 'src/unicode_printable.h'
      - 'src/unicode_tables.h'
      - 'src/unicode_case.h'
      - 'src/html_entities.h'
      - 'scripts/gen_unicode_printable.py'
      - 'scripts/gen_unicode_tables.py'
      - 'scripts/gen_unicode_case.py'
      - 'scripts/gen_html_entities.py'
      - '.github/workflows/parity-expectations.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'test/parity/**'
      - 'src/unicode_printable.h'
      - 'src/unicode_tables.h'
      - 'src/unicode_case.h'
      - 'src/html_entities.h'
      - 'scripts/gen_unicode_printable.py'
      - 'scripts/gen_unicode_tables.py'
      - 'scripts/gen_unicode_case.py'
      - 'scripts/gen_html_entities.py'
      - '.github/workflows/parity-expectations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: expectations match jinja2
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pinned jinja2
      run: python -m pip install -r test/parity/requirements.txt

    - name: Check expectations
      run: python test/parity/generate.py --check

    - name: Self-test update_divergences.py
      run: python test/parity/update_divergences.py --self-test

    # repr() escaping follows this Python's Unicode database (src/unicode_printable.h)
    - name: Check the printable-character table
      run: python scripts/gen_unicode_printable.py --check src/unicode_printable.h

    # The other generated tables follow this Python too: regex classes and int()/float()
    # digits (unicode_tables.h), case mapping (unicode_case.h), html.unescape (html_entities.h)
    - name: Check the generated Unicode and HTML tables
      run: |
        python scripts/gen_unicode_tables.py --check
        python scripts/gen_unicode_case.py --check
        python scripts/gen_html_entities.py --check
