name: CI-macos-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-build:
    name: ${{ matrix.os }} AppleClang C++${{ matrix.cxx-standard }} ${{ matrix.build-config }}${{ matrix.bigint && format(' bigint={0}', matrix.bigint) || '' }}
    runs-on: ${{ matrix.os }}

    # Release builds every standard, on both runner images; one Debug build on the newest
    # image and AppleClang. Debug adds the full node reference checks, which the Linux
    # Debug rows cover, and macOS has 5 runners to share (docs/tasks/0162). One Release build
    # has the Boost big-integer backend built in (JINJA2CPP_WITH_BIGINT, docs/tasks/0272).
    # Ninja bounds the compile jobs to the core count: with Makefiles a bare --parallel is
    # `make -j` without a limit, which thrashed the 3-core, 7 GB runners (builds of 50-110
    # min against 5 on Linux in October 2026).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, cxx-standard: 17, build-config: Release }
          - { os: macos-14, cxx-standard: 23, build-config: Release }
          - { os: macos-15, cxx-standard: 20, build-config: Release, bigint: boost }
          - { os: macos-15, cxx-standard: 20, build-config: Debug }

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install Ninja
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        command -v ninja >/dev/null || brew install ninja
        ninja --version

    - uses: ./.github/actions/setup-ccache
      with:
        key: macos-${{ matrix.os }}-${{ matrix.cxx-standard }}-${{ matrix.build-config }}-${{ matrix.bigint || 'none' }}
        # A Debug build fills the default 200M, so objects of the previous master commit
        # get evicted before a pull request can reuse them
        max-size: 500M

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-config }} \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.cxx-standard }} \
          -DJINJA2CPP_WITH_BIGINT=${{ matrix.bigint || 'none' }}

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure
