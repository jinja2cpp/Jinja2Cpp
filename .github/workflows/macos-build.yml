name: CI-macos-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-build:
    name: ${{ matrix.os }} AppleClang C++${{ matrix.cxx-standard }} ${{ matrix.build-config }}
    runs-on: ${{ matrix.os }}

    # Release builds every standard, on both runner images; one Debug build on the newest
    # image and AppleClang. Debug adds the full node reference checks, which the Linux
    # Debug rows cover, and macOS has 5 runners to share (docs/tasks/0162).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, cxx-standard: 17, build-config: Release }
          - { os: macos-14, cxx-standard: 23, build-config: Release }
          - { os: macos-15, cxx-standard: 20, build-config: Release }
          - { os: macos-15, cxx-standard: 20, build-config: Debug }

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-ccache
      with:
        key: macos-${{ matrix.os }}-${{ matrix.cxx-standard }}-${{ matrix.build-config }}

    - name: Configure
      run: |
        cmake -S . -B .build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-config }} \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.cxx-standard }}

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure
