name: clang-tidy

# Static analysis with the checks in .clang-tidy (docs/tasks/0054).
# Pull requests: only diagnostics on lines the PR changes are reported, as annotations.
# The job fails only for checks listed in WarningsAsErrors, which grows batch by batch
# as each check is cleaned from the whole tree (a ratchet).
# Weekly and on demand: the whole tree, with per-check counts in the job summary.

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/**'
      - 'test/**'
      - '.clang-tidy'
      - 'test/.clang-tidy'
      - 'scripts/null_compare.*'
      - '.github/workflows/clang-tidy.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: Ubuntu 24.04 ships clang-tidy 18, which lacks about 40 of the configured checks.
  CLANG_TIDY_VERSION: 22.1.8

jobs:
  clang-tidy:
    name: clang-tidy (${{ github.event_name == 'pull_request' && 'changed lines' || 'whole tree' }})
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: clang-18

    # The system Python refuses pip installs (PEP 668); setup-python's does not.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install clang-tidy and clang-query
      run: |
        python -m pip install "clang-tidy==${CLANG_TIDY_VERSION}" pyyaml==6.0.3
        sudo apt-get install -y --no-install-recommends clang-tools-18
        bin="$(python -c 'import clang_tidy, os; print(os.path.join(os.path.dirname(clang_tidy.__file__), "data", "bin"))')"
        echo "TIDY_BIN=$bin" >> "$GITHUB_ENV"
        echo "CLANG_TIDY=$(command -v clang-tidy)" >> "$GITHUB_ENV"
        clang-tidy --version

    # The analysis runs at the minimum supported standard, C++17 (docs/tasks/0070), so
    # every suggested fix compiles there.
    # Configure only: no generated sources, so nothing needs building.
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=17

    - name: clang-tidy on changed lines
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -o pipefail
        status=0
        # The Boost components (bindings/boost_*) and the Boost.JSON binding test have no
        # include path in this build, which tests the nlohmann_json binding only, so
        # clang-tidy can only report "file not found" for them (docs/tasks/0311).
        # Vendored headers stay out, as in ExcludeHeaderFilterRegex: clang-tidy-diff
        # checks a changed header as its own file, past the header filter.
        # A header borrows the flags of the most similar file in the database, which can be a
        # dependency's source file, so the generated include directory (jinja2cpp/version.h)
        # is passed explicitly.
        git diff -U0 --no-color "$BASE_SHA" -- src include bindings test \
            ':!bindings/boost_*' ':!test/binding/boost_json*' \
            ':!include/jinja2cpp/polymorphic_value/*' ':!src/robin_hood.h' ':!src/lexertk.h' \
            ':!src/unicode_tables.h' ':!test/*.inc' ':!test/package/*' \
          | python "$TIDY_BIN/clang-tidy-diff.py" -p1 -path build -j "$(nproc)" -quiet \
              -clang-tidy-binary "$CLANG_TIDY" \
              -extra-arg=-Wno-unknown-warning-option \
              -extra-arg=-I"$GITHUB_WORKSPACE/build/generated/include" \
          | tee tidy.log || status=$?
        # Annotate each diagnostic once, on the line it names.
        grep -E '^/[^ ]+:[0-9]+:[0-9]+: (warning|error): ' tidy.log | sort -u \
          | sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)#::\4 file=\1,line=\2,col=\3::\5#" || true
        exit "$status"

    - name: Comparisons with nullptr in conditions (changed lines)
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # The tree is clean since task 0058, so a new match fails the pull request.
      run: python scripts/null_compare.py -p build --changed "$BASE_SHA" --github --fail --clang-query clang-query-18

    - name: clang-tidy on the whole tree
      if: github.event_name != 'pull_request'
      run: |
        python "$TIDY_BIN/run-clang-tidy.py" -p build -j "$(nproc)" -quiet \
          -clang-tidy-binary "$CLANG_TIDY" \
          -extra-arg=-Wno-unknown-warning-option \
          "$GITHUB_WORKSPACE/(src|test)/.*\.cpp$" > tidy.log 2>&1 || status=$?
        # Headers are not in the compile database. The pull-request job analyses a changed
        # header on its own, so check each one that way too (docs/tasks/0085). Skipped:
        # vendored headers and the Boost components, which this configuration does not
        # give an include path: the big-integer adapter is analysed through
        # test/big_int_test.cpp, which includes it (docs/tasks/0272), and Boost.JSON in
        # bindings.yml (docs/tasks/0311).
        git ls-files 'src/*.h' 'include/jinja2cpp/*.h' 'bindings/nlohmann_json/*.h' \
            ':!src/robin_hood.h' ':!src/lexertk.h' ':!src/unicode_*.h' \
            ':!include/jinja2cpp/polymorphic_value/*' \
          | xargs -P "$(nproc)" -n 1 "$CLANG_TIDY" -p build --quiet --extra-arg=-Wno-unknown-warning-option \
          >> tidy.log 2>&1 || status=1
        {
          echo '### clang-tidy hits per check (unique locations)'
          echo '| hits | check |'
          echo '|---:|---|'
          grep -E '^/[^ ]+:[0-9]+:[0-9]+: (warning|error): .*\[[a-z0-9.,-]+\]$' tidy.log \
            | sed -E 's#/src/binding/\.\./#/src/#; s#/test/\.\./#/#' | sort -u \
            | sed -E 's/.*\[([a-z0-9.,-]+)\]$/\1/' | tr ',' '\n' | sort | uniq -c | sort -rn \
            | awk '{ printf "| %s | %s |\n", $1, $2 }'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "${status:-0}"

    - name: Comparisons with nullptr in conditions (whole tree)
      if: github.event_name != 'pull_request'
      run: python scripts/null_compare.py -p build --github --fail --clang-query clang-query-18

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: clang-tidy-log
        path: tidy.log
        if-no-files-found: ignore
