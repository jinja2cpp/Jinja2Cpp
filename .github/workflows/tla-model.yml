name: tla-model

# The bounded TLC runs of tla/CellProtocol.tla (tla/check.py) and of the cycle collector's spec,
# tla/CycleCollector.tla (tla/collector_check.py): every pass run must explore its whole space
# and every mutant must find its counterexample. The longest runs take one to two
# hours each on four cores, past what an agent's session can hold (docs/tasks/0350), so they
# run here, one job per shard, in parallel. The trace validation of the C++ against
# tla/CellTrace.tla runs in the linux-build `celltrace` row instead.
#
# Pull requests run the cell model when they change it or check.py, and the collector job when
# they change its spec or collector_check.py (both for this file); nightly runs them on master only
# when tla/ changed in the last day; workflow_dispatch runs it on any branch, all shards or a
# chosen list of runs (`runs`, names from `tla/check.py --list`).

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs to check, space separated (empty: every shard)'
        required: false
        default: ''
  pull_request:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/tla-model.yml'
      - 'tla/CellProtocol.tla'
      - 'tla/check.py'
      - 'tla/CycleCollector.tla'
      - 'tla/collector_check.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
  TLA_SHA256: fc6878c603f0fdc18b9fe3e5bf51860cb90ab5b1154e3c371660c036d6bdd63e

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      collector: ${{ steps.plan.outputs.collector }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Pick the shards
      id: plan
      env:
        RUNS: ${{ github.event.inputs.runs }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = schedule ] && [ -z "$(git log --since='25 hours ago' --format=%H -- tla/)" ]; then
          echo "tla/ unchanged in the last day: nothing to check"
          echo 'shards=[]' >> "$GITHUB_OUTPUT"
          echo 'collector=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'collector=true' >> "$GITHUB_OUTPUT"
        # A pull request that changes only the collector's spec skips the hours of the cell model
        if [ "$EVENT" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(tla/CellProtocol\.tla|tla/check\.py|\.github/workflows/tla-model\.yml)$'; then
          echo 'shards=[]' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "${RUNS:-}" ]; then
          shards=$(python3 -c 'import json, sys; print(json.dumps([{"name": "chosen", "args": "--only " + sys.argv[1]}]))' "$RUNS")
        else
          # render takes about 2 h, mixed and threads under 1 h each, the rest about 1 h
          shards='[{"name": "render", "args": "--only render"},
                   {"name": "mixed", "args": "--only mixed"},
                   {"name": "threads", "args": "--only threads"},
                   {"name": "rest", "args": "--except render mixed threads"}]'
        fi
        echo "shards=$(echo "$shards" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  tlc:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    name: tlc (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # The render run keeps about 21 GB of TLC state on disk: drop preinstalled toolchains this
    # job does not use and put the state on the larger of /mnt and the runner's temp directory
    - name: Make room for TLC state
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        work="$RUNNER_TEMP/tlc"
        if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail "$RUNNER_TEMP" | tail -1)" ]; then
          sudo mkdir -p /mnt/tlc && sudo chown "$(id -u):$(id -g)" /mnt/tlc
          work=/mnt/tlc
        fi
        mkdir -p "$work"
        echo "TMPDIR=$work" >> "$GITHUB_ENV"
        df -h / /mnt "$RUNNER_TEMP" || true
        nproc; free -g; java -version

    - name: Fetch TLC
      run: |
        set -euo pipefail
        curl -sSfL --retry 3 -o tla/tla2tools.jar "$TLA_URL"
        echo "$TLA_SHA256  tla/tla2tools.jar" | sha256sum -c -

    - name: Check the model
      env:
        # TLC's fingerprint set and queue grow in the heap first; the rest of RAM is page cache
        TLC_JAVA_OPTS: -Xmx10g
        SHARD_ARGS: ${{ matrix.shard.args }}
      run: |
        set -euo pipefail
        printf '| | Run | Kind | Verdict | States | Time |\n|---|---|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
        # shellcheck disable=SC2086 # SHARD_ARGS is a list of words
        python3 tla/check.py $SHARD_ARGS --traces 2>&1 | tee "$TMPDIR/check.log"

    - name: Keep the TLC logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tlc-${{ matrix.shard.name }}
        path: |
          ${{ env.TMPDIR }}/check.log
          ${{ env.TMPDIR }}/tlc-cells-*/*/tlc.out
          ${{ env.TMPDIR }}/tlc-cells-*/*/MC.cfg
        if-no-files-found: ignore

  # The collector's spec is small: every run in a few minutes, so one job checks all of it
  collector:
    needs: plan
    if: needs.plan.outputs.collector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Fetch TLC
      run: |
        set -euo pipefail
        curl -sSfL --retry 3 -o tla/tla2tools.jar "$TLA_URL"
        echo "$TLA_SHA256  tla/tla2tools.jar" | sha256sum -c -

    - name: Check the collector's spec
      run: |
        set -euo pipefail
        printf '| | Run | Kind | Verdict | States | Time |\n|---|---|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
        python3 tla/collector_check.py --traces 2>&1 | tee "$RUNNER_TEMP/collector.log"

    - name: Keep the TLC logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tlc-collector
        path: |
          ${{ runner.temp }}/collector.log
          /tmp/tlc-collector-*/*/tlc.out
          /tmp/tlc-collector-*/*/MC.cfg
        if-no-files-found: ignore
