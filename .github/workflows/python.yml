name: CI-python

# The Python module jinja2cpp (python/, docs/python.md, docs/tasks/0353): built in Debug with
# AddressSanitizer and UndefinedBehaviorSanitizer, its pytest suite run against the pinned Python
# Jinja2 with libasan preloaded into the (uninstrumented) interpreter, then `pip install .` as a
# user installs it. One job on the CPython floor (3.12, .python-version); the wheel matrix is
# docs/tasks/0356.
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'python/**'
      - 'src/**'
      - 'include/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'python/**'
      - 'src/**'
      - 'include/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module:
    name: Python ${{ matrix.python }} module, Debug address+undefined (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.12', compiler: gcc-14 }

    env:
      # The interpreter's own allocations at exit are no leaks of the module: the refcount
      # loop in python/tests/test_lifetime.py checks the module's references
      ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install the oracle and pytest
      run: python -m pip install -r test/parity/requirements.txt pytest

    - uses: ./.github/actions/setup-ccache
      with:
        key: python-${{ matrix.compiler }}-${{ matrix.python }}-asan

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_BUILD_PYTHON=ON \
          -DJINJA2CPP_BUILD_TESTS=OFF \
          -DJINJA2CPP_WITH_BIGINT=boost \
          -DJINJA2CPP_WITH_SANITIZERS=address+undefined \
          -DJINJA2CPP_STRICT_WARNINGS=ON \
          "-DPython_EXECUTABLE=$(command -v python)" \
          "-DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized"

    - name: Build
      run: cmake --build .build --parallel

    # From a directory outside python/, so that the package imported is the build's, which
    # has the module next to its sources (python/CMakeLists.txt). The interpreter links no
    # libstdc++: it is preloaded after libasan, or ASan's __cxa_throw finds no real one and the
    # first C++ exception aborts
    - name: Test under ASan
      working-directory: .build/python
      run: |
        export LD_PRELOAD="$("$CC" -print-file-name=libasan.so) $("$CXX" -print-file-name=libstdc++.so)"
        PYTHONPATH="$PWD" python -m pytest -p no:cacheprovider -ra "$GITHUB_WORKSPACE/python/tests"

    - name: pip install .
      run: |
        python -m pip install -v .
        cd "$RUNNER_TEMP"
        python -m pytest -p no:cacheprovider -q "$GITHUB_WORKSPACE/python/tests"
