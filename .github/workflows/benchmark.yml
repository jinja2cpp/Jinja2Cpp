name: benchmark

# Builds the Google Benchmark suite (bench/, docs/tasks/0011). Two jobs:
# - bench: checks that every case renders the same text as Python Jinja2 and runs both
#   engines, plus inja and minja (bench/engines_bench.cpp) and MiniJinja and Tera
#   (bench/rust, cargo comes with the runner image) where they render the same text;
#   the comparison table goes to the job summary and the numbers to an artifact.
#   Shared runners vary by 5-15% between runs, so it reports and does not gate.
# - instructions (pull requests): builds the base commit and the PR head on the same
#   runner, counts instructions per benchmark iteration under callgrind (deterministic to
#   about 0.05%) and fails when a benchmark costs more than 3% over the base. It also
#   simulates the caches (count.py --cache-sim) and reports D1/LL/I1 misses next to them,
#   without gating on them (docs/tasks/0137).
# - trend (pushes to master): counts instructions and allocations the same way and appends
#   them, with the cache misses, to history.jsonl on the bench-data branch, with a README table and SVG charts
#   (bench/trend.py), so every merged change shows up as a step in the trend. When counts
#   creep up over several merges that each passed the PR gate, it comments on the open
#   "Benchmark drift on master" issue (or opens it).

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/benchmark.yml'
  # Nightly wall-clock run on master: its artifacts are the trend record
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Jinja2C++ vs Python Jinja2
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pinned jinja2
      run: python -m pip install -r test/parity/requirements.txt

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON \
          -DJINJA2CPP_BENCH_WITH_OTHER_ENGINES=ON -DJINJA2CPP_BENCH_WITH_RUST_ENGINES=ON
        cmake --build build --target jinja2cpp_bench engines_bench rust_engines_bench --parallel

    # inja, minja (docs/tasks/0120), MiniJinja and Tera (0135) columns too, on the cases they
    # render like Python
    - name: Run
      run: |
        python bench/run.py --bench build/bench/jinja2cpp_bench --engines build/bench/engines_bench \
          --engines build/bench/rust/release/rust_engines_bench \
          --repetitions 5 --out bench-results.json | tee -a "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: bench-results
        path: bench-results.json
        retention-days: 90

  instructions:
    name: instruction counts vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

    # The source and build paths end up in the binaries (__FILE__), and their lengths move
    # code and data addresses: identical sources built in two directories differed by up to
    # 14% in cache misses. Mapping both to fixed names makes those builds identical.
    - name: Build the PR head
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON \
          "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=$PWD=S -ffile-prefix-map=$PWD/build=B"
        cmake --build build --target jinja2cpp_bench --parallel

    - name: Build the base commit
      run: |
        git worktree add ../base ${{ github.event.pull_request.base.sha }}
        cmake -S ../base -B build-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON \
          "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=$(realpath ../base)=S -ffile-prefix-map=$PWD/build-base=B"
        cmake --build build-base --target jinja2cpp_bench --parallel

    # Both binaries run the PR's cases, so a changed case is compared like for like
    - name: Count and compare
      run: |
        if ! grep -q -- '--count=' ../base/bench/jinja2cpp_bench.cpp; then
          echo "The base has no --count mode yet; reporting the PR's counts only." | tee -a "$GITHUB_STEP_SUMMARY"
          python bench/count.py --bench build/bench/jinja2cpp_bench --cache-sim | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # A base driver that does not read a case's settings.json (before docs/tasks/0119) would
        # run those cases with other settings; it counts its own cases then, and the new ones show as new
        base_cases=bench/cases
        grep -q 'settings.json' ../base/bench/jinja2cpp_bench.cpp || base_cases=../base/bench/cases
        python bench/count.py --bench build-base/bench/jinja2cpp_bench --cases-dir "$base_cases" --cache-sim --out base.json
        python bench/count.py --bench build/bench/jinja2cpp_bench --baseline base.json --cache-sim \
          --threshold 0.03 | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"


  trend:
    name: trend on bench-data
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    # One writer at a time on the data branch; later pushes queue instead of racing
    concurrency:
      group: bench-trend
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON
        cmake --build build --target jinja2cpp_bench --parallel

    - name: Count
      run: python bench/count.py --bench build/bench/jinja2cpp_bench --cache-sim --out counts.json

    - name: Append to bench-data
      env:
        SHA: ${{ github.sha }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin bench-data >/dev/null; then
          git fetch --depth=1 origin bench-data
          git worktree add data FETCH_HEAD
          git -C data switch -C bench-data
        else
          git worktree add --detach data
          git -C data switch --orphan bench-data
        fi
        python bench/trend.py append --history data/history.jsonl --counts counts.json --sha "$SHA" \
          --date "$(git show -s --format=%cI "$SHA")" --subject "$(git show -s --format=%s "$SHA")"
        python bench/trend.py render --history data/history.jsonl --out data \
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
        git -C data add -A
        git -C data commit -q -m "trend: ${SHA::7}"
        git -C data push origin bench-data
        echo "Trend updated: ${{ github.server_url }}/${{ github.repository }}/tree/bench-data" >> "$GITHUB_STEP_SUMMARY"

    - name: Report drift
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python bench/trend.py drift --history data/history.jsonl --window 10 --threshold 0.03 --out drift.md \
          --repo-url "${{ github.server_url }}/${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"
        [ -s drift.md ] || exit 0
        title="Benchmark drift on master"
        issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
          --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
        if [ -n "$issue" ]; then
          gh issue comment "$issue" --body-file drift.md
        else
          gh issue create --title "$title" --body-file drift.md
        fi
