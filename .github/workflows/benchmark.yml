name: benchmark

# Builds the Google Benchmark suite (bench/, docs/tasks/0011). Two jobs:
# - bench: checks that every case renders the same text as Python Jinja2 and runs both
#   engines; the comparison table goes to the job summary and the numbers to an artifact.
#   Shared runners vary by 5-15% between runs, so it reports and does not gate.
# - instructions (pull requests): builds the base commit and the PR head on the same
#   runner, counts instructions per benchmark iteration under callgrind (deterministic to
#   about 0.05%) and fails when a benchmark costs more than 3% over the base.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - '.github/workflows/benchmark.yml'
  # Nightly wall-clock run on master: its artifacts are the trend record
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Jinja2C++ vs Python Jinja2
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pinned jinja2
      run: python -m pip install -r test/parity/requirements.txt

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON
        cmake --build build --target jinja2cpp_bench --parallel

    - name: Run
      run: |
        python bench/run.py --bench build/bench/jinja2cpp_bench --repetitions 5 \
          --out bench-results.json | tee -a "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: bench-results
        path: bench-results.json
        retention-days: 90

  instructions:
    name: instruction counts vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

    - name: Build the PR head
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON
        cmake --build build --target jinja2cpp_bench --parallel

    - name: Build the base commit
      run: |
        git worktree add ../base ${{ github.event.pull_request.base.sha }}
        cmake -S ../base -B build-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_BENCHMARKS=ON
        cmake --build build-base --target jinja2cpp_bench --parallel

    # Both binaries run the PR's cases, so a changed case is compared like for like
    - name: Count and compare
      run: |
        if ! grep -q -- '--count=' ../base/bench/jinja2cpp_bench.cpp; then
          echo "The base has no --count mode yet; reporting the PR's counts only." | tee -a "$GITHUB_STEP_SUMMARY"
          python bench/count.py --bench build/bench/jinja2cpp_bench | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python bench/count.py --bench build-base/bench/jinja2cpp_bench --out base.json
        python bench/count.py --bench build/bench/jinja2cpp_bench --baseline base.json \
          --threshold 0.03 | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"

