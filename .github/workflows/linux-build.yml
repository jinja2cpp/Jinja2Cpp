name: CI-linux-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-build:
    name: ${{ matrix.compiler }} C++${{ matrix.cxx-standard }} ${{ matrix.build-config }} shared=${{ matrix.build-shared }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, gcc-13, gcc-14, clang-18, clang-19, clang-20]
        cxx-standard: [14, 17, 20]
        build-config: [Debug, Release]
        build-shared: ['OFF']
        include:
          - { compiler: gcc-14,   cxx-standard: 17, build-config: Release, build-shared: 'ON' }
          - { compiler: clang-20, cxx-standard: 17, build-config: Release, build-shared: 'ON' }

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-config }} \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.cxx-standard }} \
          -DJINJA2CPP_BUILD_SHARED=${{ matrix.build-shared }} \
          -DJINJA2CPP_STRICT_WARNINGS=ON \
          "-DCMAKE_CXX_FLAGS=${{ startsWith(matrix.compiler, 'gcc') && '-Wno-error=maybe-uninitialized' || '' }}"

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

  json-bindings:
    name: JSON bindings (${{ matrix.bindings }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        bindings: [boost, nlohmann, rapid]

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=17 \
          -DJINJA2CPP_WITH_JSON_BINDINGS=${{ matrix.bindings }}

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

  sanitizers:
    name: ${{ matrix.sanitizer }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: clang-18, sanitizer: address+undefined }
          - { compiler: gcc-14,   sanitizer: address+undefined }

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=17 \
          -DJINJA2CPP_WITH_SANITIZERS=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

  coverage:
    name: Coverage (gcc-14)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - name: Install lcov
      run: sudo apt-get install -y --no-install-recommends lcov

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_WITH_COVERAGE=ON

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

    - name: Collect coverage
      run: |
        lcov --gcov-tool gcov-14 --capture --directory .build --output-file coverage.info \
          --ignore-errors mismatch,negative,unused
        lcov --extract coverage.info "${GITHUB_WORKSPACE}/src/*" "${GITHUB_WORKSPACE}/include/*" \
          --output-file coverage.info --ignore-errors unused
        {
          echo '### Line coverage of src/ and include/'
          echo '```'
          lcov --summary coverage.info 2>&1 | grep -E 'lines|functions'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: coverage.info
