name: CI-linux-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The C++ standard is the primary axis: every supported standard (17, 20, 23) is built
  # by the oldest and the newest supported GCC and Clang. The other axes (build type,
  # linkage) are covered pairwise: every pair of values of any two axes appears in at
  # least one of those 12 jobs, instead of the full product. When
  # adding a standard, add one row per compiler and spread the other values so that pairs
  # stay covered (docs/tasks/0005). The C++26 rows sit outside that design: a
  # forward-compatibility check on the newest compilers only (docs/tasks/0070).
  # Node reference checks (JINJA2CPP_NODEREF_CHECKS, 0118 P4c) are one more pairwise axis:
  # four rows build with them OFF, so that OFF meets every standard, compiler, build type
  # and linkage, and the rest keep the default (ON in Release, FULL in Debug).
  # Two rows also install the library and build a consumer against the installed package
  # at another standard (`package`, docs/tasks/0068): a static and a shared install, each
  # read through find_package and pkg-config. It is a check after the tests, not an axis.
  # One shared row per standard builds RelWithDebInfo (`abi`) so that abidiff can compare
  # the library's exported ABI with the previous one (docs/tasks/0076): the headers differ
  # by standard, so the ABI is checked once per standard. For the pairwise design those rows
  # count as Release (optimised); the remaining Release rows still meet every standard,
  # compiler, linkage and noderef value on their own.
  # The built-in big-integer backend (JINJA2CPP_WITH_BIGINT, docs/tasks/0272) is one more
  # pairwise axis: five rows build `bigint: boost`, so that boost meets every standard,
  # compiler, build type, linkage and noderef value, the rest keep `none` and still
  # do too, and one of them checks the installed package.
  # The `debug-containers` job sits outside the matrix too: a checking standard library
  # (docs/tasks/0344), one row per library.
  # The `boost-free` job sits outside the matrix: the defaults with tests OFF fetch and
  # install no Boost at all (docs/tasks/0230).
  # One Debug row builds the borrowed-cell trace hooks (`celltrace`, JINJA2CPP_CELL_TRACE) and
  # checks the traces of the cell and module tests against tla/CellTrace.tla with TLC
  # (docs/tasks/0338 step B). It is a check after the tests, not an axis.
  # JSON bindings are package components (docs/tasks/0311): these jobs test the nlohmann_json
  # binding and the JsonTraits contract on toy traits (JINJA2CPP_TEST_BINDINGS default);
  # bindings.yml tests every binding on PRs that touch them, and nightly.
  linux-build:
    name: C++${{ matrix.std }} ${{ matrix.compiler }} ${{ matrix.config }} shared=${{ matrix.shared }}${{ matrix.noderef == 'OFF' && ' noderef=OFF' || '' }}${{ matrix.bigint && format(' bigint={0}', matrix.bigint) || '' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { std: 17, compiler: gcc-12,   config: Release, shared: 'OFF', noderef: 'OFF', bigint: boost }
          - { std: 17, compiler: gcc-14,   config: Debug,   shared: 'OFF', celltrace: true }
          - { std: 17, compiler: clang-18, config: RelWithDebInfo, shared: 'ON', abi: true }
          - { std: 17, compiler: clang-20, config: Release, shared: 'OFF', package: 23, bigint: boost }
          - { std: 20, compiler: gcc-12,   config: RelWithDebInfo, shared: 'ON', abi: true }
          - { std: 20, compiler: gcc-14,   config: Release, shared: 'ON',  bigint: boost }
          - { std: 20, compiler: clang-18, config: Debug,   shared: 'OFF' }
          - { std: 20, compiler: clang-20, config: Debug,   shared: 'OFF', noderef: 'OFF', bigint: boost }
          - { std: 23, compiler: gcc-12,   config: Debug,   shared: 'OFF' }
          - { std: 23, compiler: gcc-14,   config: RelWithDebInfo, shared: 'ON', noderef: 'OFF', package: 17, abi: true }
          - { std: 23, compiler: clang-18, config: Release, shared: 'ON',  noderef: 'OFF', bigint: boost }
          - { std: 23, compiler: clang-20, config: Debug,   shared: 'ON' }
          - { std: 26, compiler: gcc-14,   config: Release, shared: 'OFF' }
          - { std: 26, compiler: clang-20, config: Debug,   shared: 'ON' }

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - uses: ./.github/actions/setup-ccache
      with:
        key: linux-${{ matrix.compiler }}-${{ matrix.config }}-${{ matrix.std }}-${{ matrix.shared }}-${{ matrix.noderef || 'default' }}-${{ matrix.bigint || 'none' }}

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.std }} \
          -DJINJA2CPP_BUILD_SHARED=${{ matrix.shared }} \
          -DJINJA2CPP_STRICT_WARNINGS=ON \
          -DJINJA2CPP_NODEREF_CHECKS=${{ matrix.noderef == 'OFF' && 'OFF' || '' }} \
          -DJINJA2CPP_WITH_BIGINT=${{ matrix.bigint || 'none' }} \
          -DJINJA2CPP_CELL_TRACE=${{ matrix.celltrace && 'ON' || 'OFF' }} \
          "-DCMAKE_CXX_FLAGS=${{ startsWith(matrix.compiler, 'gcc') && '-Wno-error=maybe-uninitialized' || '' }}"

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

    - name: Trace validation
      if: matrix.celltrace
      run: |
        curl -sSfLo tla/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla/tla2tools.jar" | sha256sum -c -
        python3 tla/check.py --trace --tests .build/jinja2cpp_tests --jobs 2 --mutants

    # abidiff against the ABI of the previous master build (report only) or, once the RC
    # commits abi/libjinja2cpp.so.2.cxx<std>.abi, against that baseline: an incompatible
    # change then fails unless SOVERSION is bumped and the baseline regenerated (0076)
    - name: ABI dump
      if: matrix.abi
      run: |
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends abigail-tools
        mkdir -p .abi
        abidw --headers-dir include --drop-private-types --no-show-locs \
          --suppressions abi/suppressions.ini \
          --out-file .abi/libjinja2cpp.so.2.cxx${{ matrix.std }}.abi .build/libjinja2cpp.so

    - name: Previous ABI dump
      if: matrix.abi && github.event_name == 'pull_request'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .abi-base
        key: abi-cxx${{ matrix.std }}-${{ github.event.pull_request.base.sha }}
        restore-keys: abi-cxx${{ matrix.std }}-

    - name: ABI report
      if: matrix.abi
      run: scripts/abi_report.sh ${{ matrix.std }}

    - name: Save ABI dump
      if: matrix.abi && github.event_name == 'push'
      run: mkdir -p .abi-base && cp .abi/*.abi .abi-base/

    - if: matrix.abi && github.event_name == 'push'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .abi-base
        key: abi-cxx${{ matrix.std }}-${{ github.sha }}

    # also when the report fails: its message points at this dump
    - if: ${{ !cancelled() && matrix.abi }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: abi-cxx${{ matrix.std }}
        path: .abi/

    - name: Installed package
      if: matrix.package
      run: |
        cmake -DBUILD_DIR=.build -DPREFIX="$RUNNER_TEMP/jinja2cpp" -DCONFIG=${{ matrix.config }} \
          -DCONSUMER_STD=${{ matrix.package }} -DEXPECT_SHARED=${{ matrix.shared }} \
          -P test/package/check_package.cmake

  # The external dependency modes take Boost (and, for external, fmt, expected-lite,
  # fast_float and nlohmann_json) from the system instead of building them (docs/tasks/0163). The library
  # links no Boost (0230): the tests take Multiprecision through Boost::headers, which a
  # b2-built Ubuntu Boost provides; bindings.yml tests the Ubuntu Boost.JSON. external-boost
  # is a deprecated alias of internal, kept until 3.0.
  external-deps:
    name: deps=${{ matrix.mode }} ${{ matrix.compiler }} ${{ matrix.config }} shared=${{ matrix.shared }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: external,       compiler: gcc-14,   config: Release, shared: 'OFF' }
          - { mode: external-boost, compiler: clang-20, config: Debug,   shared: 'ON' }

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - uses: ./.github/actions/setup-ccache
      with:
        key: deps-${{ matrix.mode }}-${{ matrix.compiler }}-${{ matrix.config }}-${{ matrix.shared }}

    - name: System dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libboost-dev nlohmann-json3-dev locales
        # A decimal-comma locale, so DecimalCommaLocaleTest runs instead of skipping (0333)
        sudo locale-gen de_DE.UTF-8

    - name: fmt, expected-lite and fast_float
      if: matrix.mode == 'external'
      run: |
        git clone --depth 1 --branch 12.2.0 https://github.com/fmtlib/fmt.git "$RUNNER_TEMP/fmt"
        cmake -S "$RUNNER_TEMP/fmt" -B "$RUNNER_TEMP/fmt/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DFMT_TEST=OFF -DFMT_DOC=OFF
        cmake --build "$RUNNER_TEMP/fmt/build"
        sudo cmake --install "$RUNNER_TEMP/fmt/build"
        git clone --depth 1 --branch v0.10.0 https://github.com/nonstd-lite/expected-lite.git "$RUNNER_TEMP/expected-lite"
        cmake -S "$RUNNER_TEMP/expected-lite" -B "$RUNNER_TEMP/expected-lite/build" -G Ninja \
          -DEXPECTED_LITE_OPT_BUILD_TESTS=OFF -DEXPECTED_LITE_OPT_BUILD_EXAMPLES=OFF
        sudo cmake --install "$RUNNER_TEMP/expected-lite/build"
        git clone --depth 1 --branch v8.2.10 https://github.com/fastfloat/fast_float.git "$RUNNER_TEMP/fast_float"
        cmake -S "$RUNNER_TEMP/fast_float" -B "$RUNNER_TEMP/fast_float/build" -G Ninja
        sudo cmake --install "$RUNNER_TEMP/fast_float/build"

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DJINJA2CPP_DEPS_MODE=${{ matrix.mode }} \
          -DJINJA2CPP_BUILD_SHARED=${{ matrix.shared }} \
          -DJINJA2CPP_STRICT_WARNINGS=ON \
          "-DCMAKE_CXX_FLAGS=${{ startsWith(matrix.compiler, 'gcc') && '-Wno-error=maybe-uninitialized' || '' }}"

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

    - name: Installed package
      run: |
        cmake -DBUILD_DIR=.build -DPREFIX="$RUNNER_TEMP/jinja2cpp" -DCONFIG=${{ matrix.config }} \
          -DCONSUMER_STD=20 -DEXPECT_SHARED=${{ matrix.shared }} \
          -P test/package/check_package.cmake

  # The default configuration without tests builds and installs with no Boost at all
  # (docs/tasks/0230): nothing of Boost is fetched, and check_package.cmake fails when the
  # install carries Boost or its CMake files name it. The install, built without any JSON
  # library, still serves the nlohmann_json component to a consumer that has the library
  # (docs/tasks/0311).
  boost-free:
    name: Boost-free default (gcc-14, tests OFF)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - uses: ./.github/actions/setup-ccache
      with:
        key: boost-free-gcc-14

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJINJA2CPP_BUILD_TESTS=OFF \
          -DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized

    - name: Build
      run: cmake --build .build --parallel

    - name: No Boost fetched
      run: |
        ls .build/_deps
        if ls .build/_deps | grep -qi boost; then
          echo "::error::the default build fetched Boost"
          exit 1
        fi

    - name: nlohmann_json for the consumer
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nlohmann-json3-dev

    - name: Installed package
      run: |
        cmake -DBUILD_DIR=.build -DPREFIX="$RUNNER_TEMP/jinja2cpp" -DCONFIG=Release \
          -DCONSUMER_STD=17 -DEXPECT_SHARED=OFF -DCOMPONENTS=nlohmann_json \
          -P test/package/check_package.cmake

  sanitizers:
    name: ${{ matrix.sanitizer }} (${{ matrix.compiler }})${{ matrix.bigint && format(' bigint={0}', matrix.bigint) || '' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Reflected JSON (nlohmann and the toy traits) runs under every sanitizer (docs/tasks/0002, 0311)
        include:
          - { compiler: clang-18, sanitizer: address+undefined }
          - { compiler: gcc-14,   sanitizer: address+undefined, bigint: boost }
          - { compiler: clang-18, sanitizer: thread }

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      # Only failures in the log: a full run under ctest --output-on-failure outgrows the log tail
      GTEST_BRIEF: 1

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - uses: ./.github/actions/setup-ccache
      with:
        key: sanitizer-${{ matrix.compiler }}-${{ matrix.sanitizer }}-${{ matrix.bigint || 'none' }}

    # Sanitizer instrumentation makes GCC emit false-positive -Wstringop-overflow
    # in libstdc++ atomics; warnings are enforced by the build matrix instead.
    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=17 \
          -DJINJA2CPP_WITH_SANITIZERS=${{ matrix.sanitizer }} \
          -DJINJA2CPP_WITH_BIGINT=${{ matrix.bigint || 'none' }} \
          -DJINJA2CPP_CHECK_SLOTS=ON \
          -DJINJA2CPP_STRICT_WARNINGS=OFF

    - name: Build
      run: cmake --build .build --parallel

    # A hang under a sanitizer prints the stuck test's output instead of running to the 6 h job limit
    - name: Test
      run: ctest --test-dir .build --output-on-failure --timeout 1200

  # A checking standard library finds what ASan cannot: a stale iterator or reference into a
  # container whose buffer is still allocated reads valid memory with the wrong value
  # (docs/tasks/0344). It changes the ABI, so each row builds everything (dependencies, tests)
  # in that mode (JINJA2CPP_DEBUG_CONTAINERS); an abort is a finding. libstdc++ has the
  # iterator-invalidation checks (_GLIBCXX_DEBUG); libc++ has hardening "debug" (bounds and
  # preconditions). The libstdc++ row adds ASan+UBSan. Container-overflow annotations are off:
  # only the library is instrumented, and with GCC 13 _GLIBCXX_SANITIZE_VECTOR makes ASan report
  # gtest's own vector growth (libc++ reports the same kind of false positive). The libc++ row has
  # no ASan: Ubuntu's libc++abi is not ASan-aware (alloc-dealloc-mismatch on exceptions).
  # The rows are outside the C++ standard x compiler matrix: one standard each.
  debug-containers:
    name: ${{ matrix.stdlib }} debug containers C++${{ matrix.std }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { std: 20, compiler: gcc-14,   stdlib: libstdc++, sanitizer: address+undefined }
          - { std: 17, compiler: clang-18, stdlib: libc++,    sanitizer: none }

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      GTEST_BRIEF: 1

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - name: Install libc++
      if: matrix.stdlib == 'libc++'
      run: sudo apt-get install -y --no-install-recommends libc++-${COMPILER##*-}-dev libc++abi-${COMPILER##*-}-dev
      env:
        COMPILER: ${{ matrix.compiler }}

    - uses: ./.github/actions/setup-ccache
      with:
        key: debug-containers-${{ matrix.compiler }}-${{ matrix.stdlib }}-${{ matrix.std }}

    # Sanitizer instrumentation makes GCC emit false-positive -Wstringop-overflow in libstdc++
    # atomics (as in the sanitizers job); warnings are enforced by the build matrix instead.
    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.std }} \
          -DJINJA2CPP_DEBUG_CONTAINERS=${{ matrix.stdlib }} \
          -DJINJA2CPP_WITH_SANITIZERS=${{ matrix.sanitizer }} \
          -DJINJA2CPP_STRICT_WARNINGS=OFF

    - name: Build
      run: cmake --build .build --parallel

    # DebugContainersTest seeds a misuse that only the checking library catches and expects an abort
    - name: Test
      run: ctest --test-dir .build --output-on-failure --timeout 1200

    # A skip (the checks are off) must not pass: the test has to run and pass
    - name: Seeded misuse aborts
      run: .build/jinja2cpp_tests --gtest_filter='DebugContainersTest.*' | tee /dev/stderr | grep -q '\[  PASSED  \] 1 test'

  coverage:
    name: Coverage (gcc-14)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - name: Install lcov
      run: sudo apt-get install -y --no-install-recommends lcov

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_WITH_COVERAGE=ON

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

    - name: Collect coverage
      run: |
        # Only the library's objects: test-file .gcda trip lcov 2.x range checks
        # on gtest macro expansions ("unknown line N ... only M lines in file").
        lcov --gcov-tool gcov-14 --capture --directory .build/CMakeFiles/jinja2cpp.dir \
          --output-file coverage.info --rc geninfo_unexecuted_blocks=1 \
          --ignore-errors mismatch,negative,unused,gcov
        lcov --extract coverage.info "${GITHUB_WORKSPACE}/src/*" "${GITHUB_WORKSPACE}/include/*" \
          --output-file coverage.info --ignore-errors unused
        {
          echo '### Line coverage of src/ and include/'
          echo '```'
          lcov --summary coverage.info 2>&1 | grep -E 'lines|functions'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-info
        path: coverage.info
