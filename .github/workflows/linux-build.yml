name: CI-linux-build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The C++ standard is the primary axis: every standard is built by the oldest and the
  # newest supported GCC and Clang. The other axes (build type, linkage, JSON bindings)
  # are covered pairwise: every pair of values of any two axes appears in at least one
  # job, which takes 12 jobs instead of the 144 of the full product. When adding a
  # standard, add one row per compiler and spread the other values so that pairs stay
  # covered (docs/tasks/0005).
  linux-build:
    name: C++${{ matrix.std }} ${{ matrix.compiler }} ${{ matrix.config }} shared=${{ matrix.shared }} json=${{ matrix.bindings }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { std: 14, compiler: gcc-12,   config: Release, shared: 'ON',  bindings: boost }
          - { std: 14, compiler: gcc-14,   config: Debug,   shared: 'ON',  bindings: rapid }
          - { std: 14, compiler: clang-18, config: Release, shared: 'OFF', bindings: rapid }
          - { std: 14, compiler: clang-20, config: Debug,   shared: 'OFF', bindings: nlohmann }
          - { std: 17, compiler: gcc-12,   config: Release, shared: 'OFF', bindings: rapid }
          - { std: 17, compiler: gcc-14,   config: Release, shared: 'ON',  bindings: nlohmann }
          - { std: 17, compiler: clang-18, config: Release, shared: 'ON',  bindings: nlohmann }
          - { std: 17, compiler: clang-20, config: Debug,   shared: 'OFF', bindings: boost }
          - { std: 20, compiler: gcc-12,   config: Debug,   shared: 'OFF', bindings: nlohmann }
          - { std: 20, compiler: gcc-14,   config: Release, shared: 'OFF', bindings: boost }
          - { std: 20, compiler: clang-18, config: Debug,   shared: 'ON',  bindings: boost }
          - { std: 20, compiler: clang-20, config: Release, shared: 'ON',  bindings: rapid }

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=${{ matrix.std }} \
          -DJINJA2CPP_BUILD_SHARED=${{ matrix.shared }} \
          -DJINJA2CPP_WITH_JSON_BINDINGS=${{ matrix.bindings }} \
          -DJINJA2CPP_STRICT_WARNINGS=ON \
          "-DCMAKE_CXX_FLAGS=${{ startsWith(matrix.compiler, 'gcc') && '-Wno-error=maybe-uninitialized' || '' }}"

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

  sanitizers:
    name: ${{ matrix.sanitizer }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: clang-18, sanitizer: address+undefined }
          - { compiler: gcc-14,   sanitizer: address+undefined }

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: ${{ matrix.compiler }}

    # Sanitizer instrumentation makes GCC emit false-positive -Wstringop-overflow
    # in libstdc++ atomics; warnings are enforced by the build matrix instead.
    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_CXX_STANDARD=17 \
          -DJINJA2CPP_WITH_SANITIZERS=${{ matrix.sanitizer }} \
          -DJINJA2CPP_STRICT_WARNINGS=OFF

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

  coverage:
    name: Coverage (gcc-14)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: ./.github/actions/install-toolchain
      with:
        compiler: gcc-14

    - name: Install lcov
      run: sudo apt-get install -y --no-install-recommends lcov

    - name: Configure
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_WITH_COVERAGE=ON

    - name: Build
      run: cmake --build .build --parallel

    - name: Test
      run: ctest --test-dir .build --output-on-failure

    - name: Collect coverage
      run: |
        # Only the library's objects: test-file .gcda trip lcov 2.x range checks
        # on gtest macro expansions ("unknown line N ... only M lines in file").
        lcov --gcov-tool gcov-14 --capture --directory .build/CMakeFiles/jinja2cpp.dir \
          --output-file coverage.info --rc geninfo_unexecuted_blocks=1 \
          --ignore-errors mismatch,negative,unused,gcov
        lcov --extract coverage.info "${GITHUB_WORKSPACE}/src/*" "${GITHUB_WORKSPACE}/include/*" \
          --output-file coverage.info --ignore-errors unused
        {
          echo '### Line coverage of src/ and include/'
          echo '```'
          lcov --summary coverage.info 2>&1 | grep -E 'lines|functions'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: coverage.info
