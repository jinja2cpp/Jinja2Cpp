# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

# Changes that cannot affect the analysed C++ code (docs, agent tooling) skip
# the analysis; the weekly scheduled run still covers the whole tree.
on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'scripts/**'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    - cron: '23 15 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    # Pushes and PRs analyse the library alone (about 5 minutes of queries). The
    # GoogleTest suite multiplies the data-flow work: with it, the shared data-flow
    # stage of the security queries took 105 minutes on master in October 2026 (it
    # was 15 at 7c838c0 and grew with every train). The weekly and manual runs still
    # analyse the tests, under their own category so the two databases do not close
    # each other's alerts.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 240 || 45 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://git.io/codeql-language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    #    - name: Autobuild
    # uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Install build tools
      timeout-minutes: 10
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

    - name: Build
      env:
        WITH_TESTS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }}
      run: |
        cmake -S . -B .build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DJINJA2CPP_DEPS_MODE=internal \
          -DJINJA2CPP_BUILD_SHARED=ON \
          -DJINJA2CPP_CXX_STANDARD=17 \
          -DJINJA2CPP_BUILD_TESTS=$WITH_TESTS
        if [ "$WITH_TESTS" = ON ]; then
          cmake --build .build --parallel --target jinja2cpp jinja2cpp_tests
        else
          cmake --build .build --parallel --target jinja2cpp
        fi

    # An empty category keeps the default one, so existing alerts stay attached.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'with-tests' || '' }}
