[package]
name = "rust_engines_bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
minijinja = { version = "2.24", features = ["loader", "json", "speedups"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
tera = "2.4"
serde = "1"
serde_json = "1"
regex = "1"
libc = "0.2"

[profile.release]
debug = 1
